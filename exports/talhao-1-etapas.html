<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F5F5F7">
<title>Talhão 1 — Etapas</title>
<style>
:root {
  --bg: #F5F5F7;
  --surface: #FFFFFF;
  --border: #E5E7EB;
  --border-soft: #E5E5E7;
  --text: #1D1D1F;
  --text2: #6B7280;
  --dis: #9CA3AF;
  --primary: #007AFF;
  --primary-soft: rgba(0,122,255,.10);
  --gold: #D4AF37;
  --gold-dark: #92670A;
  --gold-surface: #2A2210;
  --amber: #FF9500;
  --c-doencas: #FF3B30;
  --c-insetos: #007AFF;
  --c-nutricao: #AF52DE;
  --c-fisiologia: #34C759;
  --success: #34C759;
  --shadow: 0 6px 16px rgba(0,0,0,.05);
  --stage: #E9E9EE;
  --pad: 16px;
  --card-h: 412px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0A0F; --surface: #1C1C1E; --border: #2C2C2E; --border-soft: #2C2C2E;
    --text: #F5F5F7; --text2: #9CA3AF; --dis: #6B7280; --shadow: none; --stage: #000;
    --primary-soft: rgba(0,122,255,.18);
  }
}
:root[data-theme="dark"] {
  --bg: #0A0A0F; --surface: #1C1C1E; --border: #2C2C2E; --border-soft: #2C2C2E;
  --text: #F5F5F7; --text2: #9CA3AF; --dis: #6B7280; --shadow: none; --stage: #000;
  --primary-soft: rgba(0,122,255,.18);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--stage);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 10px; }
svg { display: block; flex: none; }

/* ── App (coluna estilo iPhone) ───────────────────────────────────────── */
.app {
  position: relative;
  width: 100%; max-width: 430px; min-height: 100dvh;
  margin: 0 auto; background: var(--bg);
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
  overflow-x: clip;
}
@media (min-width: 480px) { .app { box-shadow: 0 0 0 1px var(--border), 0 20px 60px rgba(0,0,0,.12); } }

.topbar { padding: calc(14px + env(safe-area-inset-top)) var(--pad) 0; }
.back { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-left: -10px; color: var(--primary); }
h1 { margin: 8px 0 0; font-size: 34px; line-height: 1.15; font-weight: 700; letter-spacing: -.6px; }

/* Situação */
.status { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 12px; padding: 22px var(--pad) 0; }
.status .now { font-size: 20px; font-weight: 600; line-height: 1.25; letter-spacing: -.2px; margin: 0; }
.status .next { flex: 0 0 100%; margin: 2px 0 0; font-size: 15px; line-height: 1.35; color: var(--text2); }
.status .next b { color: var(--text); font-weight: 600; }
.status .next .rel { color: var(--primary); font-weight: 600; }
.ring { display: flex; align-items: center; gap: 8px; color: var(--text2); font-size: 15px; white-space: nowrap; }
.ring svg circle { fill: none; stroke-width: 3.2; }
.ring .trk { stroke: var(--border); }
.ring .bar { stroke: var(--primary); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .6s ease; }

/* Linha do tempo */
.stepper {
  margin-top: 14px; height: 85px; overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none; border-bottom: 1px solid var(--border-soft);
  cursor: grab; overscroll-behavior-x: contain;
}
.stepper::-webkit-scrollbar { display: none; }
.stepper.dragging { cursor: grabbing; }
.st-inner { position: relative; height: 84px; }
.st-track, .st-done { position: absolute; top: 41px; height: 2px; background: var(--border); }
.st-done { top: 40.5px; height: 3px; background: var(--primary); border-radius: 2px; }
.hoje { position: absolute; top: 0; width: 60px; height: 47px; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
.hoje span { margin-top: 4px; background: var(--primary); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .2px; line-height: 1.2; padding: 2px 7px; border-radius: 8px; }
.hoje i { flex: 1; width: 2px; background: var(--primary); }
.hoje em { width: 9px; height: 9px; border-radius: 50%; background: var(--bg); border: 2.5px solid var(--primary); margin-bottom: .5px; }
.node { position: absolute; top: 0; width: 64px; height: 84px; }
.node .dot { position: absolute; left: 50%; border-radius: 50%; transform: translateX(-50%); }
.node.done .dot { width: 18px; height: 18px; top: 33px; background: var(--primary); display: grid; place-items: center; color: #fff; }
.node.future .dot { width: 12px; height: 12px; top: 36px; background: var(--bg); border: 2px solid var(--border); }
.node.next .dot { width: 22px; height: 22px; top: 31px; background: var(--bg); border: 4px solid var(--primary); animation: pulse 1.6s ease-in-out infinite alternate; }
.node .focus { position: absolute; left: 50%; top: 27px; width: 30px; height: 30px; margin-left: -15px; border: 1.5px solid var(--primary); border-radius: 50%; opacity: 0; transform: scale(.7); transition: opacity .2s, transform .2s; }
.node.on .focus { opacity: 1; transform: none; }
.node.next .focus { display: none; }
.node .lbl { position: absolute; left: 0; right: 0; top: 58px; text-align: center; font-size: 12px; line-height: 1.2; font-weight: 600; color: var(--text2); }
.node.done .lbl { color: var(--text); }
.node.on .lbl, .node.next .lbl { color: var(--primary); font-weight: 700; }
.node .lbl small { display: block; font-size: 10px; font-weight: 500; color: var(--primary); margin-top: 1px; }
@keyframes pulse { from { box-shadow: 0 0 0 7px rgba(0,122,255,.06); } to { box-shadow: 0 0 0 2px rgba(0,122,255,.36); } }

/* Etapas / carrossel */
.etapas { padding-top: 32px; }
.etapas-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 var(--pad); }
.etapas-head h2 { margin: 0; font-size: 20px; line-height: 1.3; font-weight: 600; letter-spacing: -.2px; }
.etapas-head .count { font-size: 15px; color: var(--text2); font-variant-numeric: tabular-nums; }
.carousel-wrap { container-type: inline-size; position: relative; margin-top: 8px; }
.carousel {
  display: flex; gap: 12px; padding: 4px 34px 18px;
  overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
  overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; cursor: grab;
}
.carousel::-webkit-scrollbar { display: none; }
.carousel.dragging { scroll-snap-type: none; cursor: grabbing; scroll-behavior: auto; }
.carousel.dragging .card { pointer-events: none; }
.nav-arrow {
  display: none; position: absolute; top: 50%; z-index: 3; width: 36px; height: 36px; margin-top: -26px;
  align-items: center; justify-content: center; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,.12); color: var(--text);
}
.nav-arrow.l { left: 4px; } .nav-arrow.r { right: 4px; }
.nav-arrow[disabled] { opacity: 0; pointer-events: none; }
@media (hover: hover) and (pointer: fine) { .nav-arrow { display: flex; } }

.card {
  flex: 0 0 calc(100cqw - 68px); width: calc(100cqw - 68px); height: var(--card-h);
  scroll-snap-align: center; scroll-snap-stop: always;
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
  box-shadow: var(--shadow); transition: border-color .2s;
}
.card.next { border: 1.5px solid var(--primary); }
.card-head { padding: 18px 20px 14px; }
.row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.chip { font-size: 13px; line-height: 1.2; font-weight: 700; padding: 4px 10px; border-radius: 8px; color: var(--primary); background: var(--primary-soft); }
.card.next .chip { background: var(--primary); color: #fff; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; line-height: 1.4; font-weight: 600; color: var(--text2); }
.card.next .pill { color: var(--primary); }
.card h3 { margin: 14px 0 0; font-size: 22px; line-height: 1.3; font-weight: 600; letter-spacing: -.3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card.done h3 { color: var(--text2); }
.when { margin: 4px 0 0; font-size: 15px; line-height: 1.3; color: var(--text2); }
.card.next .when { color: var(--primary); font-weight: 600; }
.why { margin: 2px 0 0; font-size: 13px; line-height: 1.4; color: var(--text2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.divider { height: 1px; background: var(--border); flex: none; }
.card-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* Produtos */
.prod-title { padding: 12px 20px 2px; font-size: 11px; font-weight: 700; letter-spacing: .8px; color: var(--text2); text-transform: uppercase; }
.prod-list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 0 8px 6px; list-style: none; margin: 0; }
.prod { display: flex; gap: 10px; padding: 10px 14px; }
.prod .bul { width: 6px; height: 6px; margin-top: 7px; border-radius: 50%; background: var(--primary); flex: none; }
.card.done .prod .bul { background: var(--dis); }
.prod b { display: block; font-size: 17px; line-height: 1.25; font-weight: 700; }
.prod span { display: block; margin-top: 2px; font-size: 14px; line-height: 1.3; color: var(--text2); font-variant-numeric: tabular-nums; }
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--text2); font-size: 13px; }
.empty svg { color: var(--dis); }

/* Faixa de atalhos (livro aberto) */
.strip { margin: 8px 12px 0; padding: 10px 16px 8px; border: 1px solid var(--border-soft); border-radius: 16px; background: var(--surface); animation: stripIn .22s cubic-bezier(.2,.8,.2,1); }
@keyframes stripIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.strip-title { font-size: 13px; line-height: 1.4; color: var(--text2); }
.strip-title b { font-weight: 700; }
.strip-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin-top: 10px; }
.shortcut { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 0; border-radius: 12px; font-size: 11px; line-height: 1.2; font-weight: 600; text-align: center; white-space: pre-line; transition: transform .12s; }
.shortcut:not([disabled]):active { transform: scale(.94); }
.shortcut[disabled] { opacity: .35; cursor: default; }
.ico { width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center; color: #fff; }
.ico.gold { background: var(--gold-surface); border: 1px solid rgba(146,103,10,.5); color: var(--gold); }

/* Rodapé do card */
.card-foot { display: flex; align-items: center; gap: 5px; padding: 14px 14px 14px 12px; border-top: 1px solid var(--border); flex: none; }
.book { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--border); background: var(--surface); color: var(--text); transition: transform .12s, border-color .15s; }
.book:not([disabled]):active { transform: scale(.92); }
.book[disabled] { opacity: .4; cursor: default; background: transparent; color: var(--dis); }
.book.sel { border: 2px solid var(--text); }
.book.gold { background: rgba(212,175,55,.14); border-color: rgba(212,175,55,.55); color: var(--gold); }
.book.gold[disabled] { background: transparent; color: var(--dis); border-color: var(--border); }
.book.gold.sel { border: 2px solid var(--gold); }
.confirm {
  margin-left: auto; flex: 0 0 auto; min-width: 165px; height: 36px; padding: 0 18px; border-radius: 11px;
  background: var(--primary); color: #fff; font-size: 17px; font-weight: 500; letter-spacing: -.1px;
  transition: transform .12s, background .2s, box-shadow .2s;
}
.confirm:active { transform: scale(.97); }
.confirm.ok { background: rgba(52,199,89,.14); color: #1E8E3E; box-shadow: inset 0 0 0 1.5px rgba(52,199,89,.55); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .confirm.ok { color: #5BE07B; } }

/* Tab bar */
.tabbar {
  position: fixed; z-index: 20; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 430px; display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 8px 4px calc(10px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: 1px solid var(--border-soft);
}
.tab { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0; font-size: 12px; line-height: 1.2; color: var(--text2); }
.tab.active { color: var(--primary); font-weight: 600; }
.tab svg { width: 28px; height: 28px; }

/* Bottom sheet */
.scrim { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; visibility: hidden; pointer-events: none; }
.scrim.open { visibility: visible; pointer-events: auto; }
.scrim .bd { position: absolute; inset: 0; background: rgba(0,0,0,.38); opacity: 0; transition: opacity .25s; }
.scrim.open .bd { opacity: 1; }
.sheet {
  position: relative; width: 100%; max-width: 430px; height: 58dvh; max-height: 88dvh;
  display: flex; flex-direction: column; background: var(--surface);
  border-radius: 20px 20px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.25);
  transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1), height .25s cubic-bezier(.2,.8,.2,1);
}
.scrim.open .sheet { transform: none; }
.sheet.dragging { transition: none; }
.grab { flex: none; padding: 10px 0 4px; cursor: grab; touch-action: none; }
.grab i { display: block; width: 38px; height: 5px; margin: 0 auto; border-radius: 3px; background: var(--border); }
.sh-head { flex: none; display: flex; align-items: center; gap: 12px; padding: 8px 16px 12px; touch-action: none; }
.sh-ico { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.sh-head h4 { margin: 0; font-size: 18px; line-height: 1.3; font-weight: 600; }
.sh-head p { margin: 0; font-size: 13px; line-height: 1.4; color: var(--text2); }
.sh-close { margin-left: auto; width: 32px; height: 32px; border-radius: 50%; background: var(--bg); color: var(--text2); display: grid; place-items: center; flex: none; }
.sh-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 16px calc(24px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border-soft); }
.ref { padding: 14px 0; border-bottom: 1px solid var(--border-soft); }
.ref:last-child { border-bottom: 0; }
.ref h5 { margin: 0; font-size: 16px; line-height: 1.4; font-weight: 600; }
.ref p { margin: 4px 0 0; font-size: 13px; line-height: 1.45; color: var(--text2); white-space: pre-line; }
.ref .foco { font-weight: 600; }
.sum { margin: 14px 0 4px; padding: 12px 14px; border-radius: 14px; background: rgba(212,175,55,.10); border: 1px solid rgba(212,175,55,.35); }
.sum .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.tag { font-size: 11px; font-weight: 700; line-height: 1.2; padding: 3px 8px; border-radius: 99px; }
.sum .tag { background: rgba(212,175,55,.2); color: var(--gold-dark); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sum .tag { color: var(--gold); } }
.sum p { margin: 0; font-size: 13px; line-height: 1.45; color: var(--text); }
.rank { display: flex; gap: 12px; }
.rank .n { flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; background: rgba(212,175,55,.16); color: var(--gold-dark); font-size: 12px; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .rank .n { color: var(--gold); } }
.metrics { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.metrics span { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 99px; background: var(--bg); color: var(--text); font-variant-numeric: tabular-nums; }
.metrics span.warn { color: #B45309; background: rgba(255,149,0,.12); }
.cesb { margin: 12px 0; padding: 12px; border-radius: 12px; background: rgba(255,149,0,.05); border: 1px solid rgba(255,149,0,.22); }
.cesb .t { display: flex; align-items: flex-start; gap: 6px; color: var(--amber); }
.cesb .t b { flex: 1; font-size: 16px; line-height: 1.35; font-weight: 700; }
.cesb .tags { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
.cesb .tag { background: rgba(255,149,0,.15); color: var(--amber); }
.cesb p { margin: 6px 0 0; font-size: 13px; line-height: 1.45; color: var(--text2); white-space: pre-line; }
.cesb p.dica { color: var(--text); font-weight: 700; }
.cesb p.foco { color: var(--text); }
.cesb p.meta { font-size: 11px; font-weight: 600; }
.cesb .win { display: inline-block; margin-top: 8px; padding: 4px 8px; border-radius: 6px; background: rgba(255,149,0,.15); color: var(--amber); font-size: 11px; font-weight: 700; }
.cesb .src { font-size: 11px; }
.aviso { margin: 12px 0 0; font-size: 12px; line-height: 1.4; color: var(--text2); }

.toast { position: fixed; z-index: 80; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translate(-50%, 12px); max-width: min(86vw, 380px); padding: 10px 16px; border-radius: 14px; background: rgba(29,29,31,.92); color: #fff; font-size: 14px; line-height: 1.35; text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}
@media print { .tabbar, .nav-arrow, .scrim { display: none; } .app { box-shadow: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <button class="back" id="back" aria-label="Voltar"><span id="ic-back"></span></button>
    <h1>Talhão 1</h1>
  </div>

  <section class="status" aria-live="polite">
    <p class="now" id="now"></p>
    <div class="ring" id="ring"></div>
    <p class="next" id="next"></p>
  </section>

  <nav class="stepper" id="stepper" aria-label="Linha do tempo da lavoura"><div class="st-inner" id="st-inner"></div></nav>

  <section class="etapas" aria-label="Etapas">
    <div class="etapas-head">
      <h2>Etapas</h2>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
    <div class="carousel-wrap">
      <button class="nav-arrow l" id="prev" aria-label="Etapa anterior"></button>
      <div class="carousel" id="carousel" tabindex="0" role="region" aria-roledescription="carrossel" aria-label="Etapas do talhão"></div>
      <button class="nav-arrow r" id="nextb" aria-label="Próxima etapa"></button>
    </div>
  </section>

  <nav class="tabbar" aria-label="Navegação principal" id="tabbar"></nav>
</div>

<div class="scrim" id="scrim" aria-hidden="true">
  <div class="bd" id="bd"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">
    <div class="grab" id="grab" aria-hidden="true"><i></i></div>
    <div class="sh-head" id="sh-head">
      <div class="sh-ico" id="sh-ico"></div>
      <div><h4 id="sh-title"></h4><p id="sh-sub"></p></div>
      <button class="sh-close" id="sh-close" aria-label="Fechar"></button>
    </div>
    <div class="sh-body" id="sh-body"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ════════════════════════════════════════════════════════════════════════
   DADOS
   REFS  → conteúdo real do app (seeds de referências + Circular fungicidas),
           extraído de agrimind/lib/features/references.
   ETAPAS → parâmetros e produtos do Talhão 1. Edite o bloco TALHAO abaixo
            para refletir outro talhão/safra.

  const c = car();
  c.addEventListener('scroll', () => requestAnimationFrame(onScroll), { passive: true });
  c.addEventListener('keydown', (ev) => { if (ev.key === 'ArrowRight') { ev.preventDefault(); goTo(Math.min(ETAPAS.length - 1, atual + 1)); } if (ev.key === 'ArrowLeft') { ev.preventDefault(); goTo(Math.max(0, atual - 1)); } });
  $('#prev').addEventListener('click', () => goTo(Math.max(0, atual - 1)));
  $('#nextb').addEventListener('click', () => goTo(Math.min(ETAPAS.length - 1, atual + 1)));
  enableMouseDrag(c); enableMouseDrag($('#stepper'), (m) => { stepperMoved = m; });
  $('#stepper').addEventListener('wheel', (ev) => { if (Math.abs(ev.deltaY) > Math.abs(ev.deltaX)) { ev.preventDefault(); $('#stepper').scrollLeft += ev.deltaY; } }, { passive: false });

  $('#bd').addEventListener('click', closeSheet); $('#sh-close').addEventListener('click', closeSheet);
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') closeSheet(); });
  initSheetDrag();

  // abre na próxima etapa (ou na última, se a safra acabou)
  const ini = PROXIMA ? PROXIMA.i : ETAPAS.length - 1;
  requestAnimationFrame(() => { goTo(ini, false); atual = -1; onScroll(); centerNode(ini, false); });
  window.addEventListener('resize', () => goTo(Math.max(atual, 0), false));
}
init();
</script>
</body>
</html>
